<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Linda's Handmade · 手作毛線手札</title>

  <!-- PWA 核心設定標籤 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="毛線手札">
  <link rel="apple-touch-icon" href="https://api.iconify.design/ph:yarn-fill.svg?color=%239b83a4&width=192&height=192">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- GSAP 核心庫與 Flip 動畫外掛 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Flip.min.js"></script>

  <!-- Phosphor Icons (精緻質感圖示庫) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Google Fonts: 法式古典襯線體 Cormorant Garamond + 思源宋體 Noto Serif TC + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script>
    const fallbackSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%23E4DAE8'/><circle cx='200' cy='150' r='55' fill='%23CFBFD5' opacity='0.5'/><text x='50%25' y='52%25' font-family='sans-serif' font-size='14' fill='%23675271' text-anchor='middle'>Tung Handmade</text></svg>";
    window.handleImgFallback = function(imgEl) {
      if (!imgEl) return;
      imgEl.onerror = null;
      imgEl.src = fallbackSvg;
    };
    window.app = { handleImgFallback: window.handleImgFallback };
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            morandi: {
              50: '#FAF8FA', 100: '#F3EEF5', 200: '#E4DAE8', 300: '#CFBFD5',
              400: '#B59FBD', 500: '#9B83A4', 600: '#81698B', 700: '#675271',
              800: '#4E3C56', 900: '#34263B',
            },
            oat: {
              50: '#FAF7F2', 100: '#F3EDE4', 200: '#E6DCCF', 300: '#D5C5B5', stone: '#433D46',
            }
          },
          fontFamily: {
            serifTitle: ['"Noto Serif TC"', '"Cormorant Garamond"', 'serif'],
            serifBrand: ['"Cormorant Garamond"', '"Noto Serif TC"', 'serif'],
            sans: ['Inter', '"Noto Serif TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root { --home-custom-bg: none; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    
    body {
      background-color: #FAF7F2;
      color: #433D46;
      font-family: 'Inter', "Noto Serif TC", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
    }

    @keyframes ink-bleed {
      0% { filter: blur(10px); opacity: 0; transform: scale(1.08); }
      100% { filter: blur(0); opacity: 1; transform: scale(1); }
    }
    .ink-char {
      display: inline-block;
      animation: ink-bleed 2.2s cubic-bezier(0.3, 1, 0.4, 1) forwards;
      opacity: 0;
    }

    @keyframes letter-bounce {
      0% { transform: scale(1, 1) translateY(0); }
      15% { transform: scale(1.2, 0.8) translateY(0); }
      40% { transform: scale(0.8, 1.2) translateY(-12px); }
      60% { transform: scale(1, 1) translateY(0); }
      75% { transform: scale(1.1, 0.9) translateY(0); }
      85% { transform: scale(0.95, 1.05) translateY(-4px); }
      100% { transform: scale(1, 1) translateY(0); }
    }
    .bounce-char {
      display: inline-block;
      opacity: 0;
      animation: ink-bleed 0.25s forwards, letter-bounce 0.8s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
    }

    .crochet-bg {
      background-color: #FAF7F2;
      background-image: 
        var(--home-custom-bg),
        radial-gradient(circle at 50% 50%, rgba(155, 131, 164, 0.05) 2px, transparent 2.5px),
        radial-gradient(circle at 0% 100%, rgba(155, 131, 164, 0.04) 3px, transparent 3.5px),
        radial-gradient(circle at 100% 0%, rgba(155, 131, 164, 0.04) 3px, transparent 3.5px);
      background-size: cover, 24px 24px, 48px 48px, 48px 48px;
      background-position: center;
    }

    .glass-bead-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 24px -4px rgba(103, 82, 113, 0.08),
                  inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.95),
                  inset 0 -2px 3px 0 rgba(155, 131, 164, 0.12);
      border-radius: 26px;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), background 0.22s;
    }
    .glass-bead-card:active {
      transform: scale(0.975);
      background: rgba(255, 255, 255, 0.92);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .color-active-glow {
      box-shadow: 0 0 0 2.5px #FFFFFF, 0 0 0 4.5px #9B83A4, 0 4px 10px rgba(155, 131, 164, 0.45);
      transform: scale(1.15) !important;
    }

    .fab-expanding {
      width: 48px; height: 48px; border-radius: 9999px;
      transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
    }
    .fab-expanding:hover, .fab-expanding:focus-within {
      width: 136px;
      box-shadow: 0 12px 28px -4px rgba(103, 82, 113, 0.38);
    }
    .fab-expanding .fab-icon { transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
    .fab-expanding:hover .fab-icon { transform: rotate(90deg); }
    .fab-expanding .fab-text {
      max-width: 0; opacity: 0; white-space: nowrap; overflow: hidden;
      transition: max-width 0.4s ease, opacity 0.3s ease 0.12s;
    }
    .fab-expanding:hover .fab-text { max-width: 85px; opacity: 1; }

    .floating-field { position: relative; margin-top: 14px; }
    .floating-input {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid #D5C5B5; padding: 6px 0; font-size: 13px;
      color: #34263B; outline: none;
    }
    .floating-label {
      position: absolute; left: 0; top: 6px; font-size: 13px;
      color: #81698B; pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-input:focus ~ .floating-label,
    .floating-input:not(:placeholder-shown) ~ .floating-label {
      top: -14px; font-size: 10px; color: #9B83A4; font-weight: 600;
    }
    .floating-line {
      position: absolute; bottom: 0; left: 0; right: 0; height: 1.5px;
      background: #9B83A4; transform: scaleX(0); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center;
    }
    .floating-input:focus ~ .floating-line { transform: scaleX(1); }

    /* 下拉選單展開動態效果 */
    .custom-dropdown { position: relative; width: 100%; }
    .custom-dropdown-btn {
      width: 100%; height: 38px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; font-size: 12px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(228, 218, 232, 0.9);
      color: #34263B; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-dropdown-btn:focus, .custom-dropdown.active .custom-dropdown-btn {
      border-color: #9B83A4; box-shadow: 0 0 0 2px rgba(155, 131, 164, 0.2);
    }
    .custom-dropdown-arrow { width: 14px; height: 14px; color: #81698B; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .custom-dropdown.active .custom-dropdown-arrow { transform: rotate(180deg); }
    .custom-dropdown-menu {
      position: absolute; left: 0; right: 0; top: calc(100% + 5px);
      background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(228, 218, 232, 0.9);
      border-radius: 16px; box-shadow: 0 12px 28px -6px rgba(103, 82, 113, 0.16);
      overflow: hidden; z-index: 60; transform-origin: top;
      transform: scaleY(0.6); opacity: 0; pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.3, 1.3, 0.5, 1), opacity 0.25s ease;
      max-height: 260px; overflow-y: auto;
    }
    .custom-dropdown.active .custom-dropdown-menu {
      transform: scaleY(1); opacity: 1; pointer-events: auto;
    }
    .custom-dropdown-item {
      padding: 9px 14px; font-size: 12px; color: #4E3C56; cursor: pointer;
      opacity: 0; transform: translateY(-8px); transition: background 0.2s, color 0.2s, opacity 0.25s, transform 0.25s;
    }
    .custom-dropdown.active .custom-dropdown-item {
      opacity: 1; transform: translateY(0); transition-delay: calc(var(--i) * 0.04s);
    }
    .custom-dropdown-item:hover, .custom-dropdown-item.selected {
      background: #F3EEF5; color: #675271; font-weight: 600;
    }
    .custom-dropdown-item.add-new { color: #9B83A4; font-weight: 700; border-top: 1px dashed #E4DAE8; }

    .view-section {
      position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
      background-color: transparent; padding: 0.5rem 0.875rem 1.5rem 0.875rem; touch-action: pan-y;
    }

    .knitting-guide-ruler {
      position: absolute; left: 0; right: 0; height: 28px; background: rgba(155, 131, 164, 0.22);
      border-top: 1.5px dashed #9B83A4; border-bottom: 1.5px dashed #9B83A4;
      cursor: ns-resize; touch-action: none; z-index: 20;
      display: flex; align-items: center; justify-content: flex-end; padding-right: 12px;
    }

    /* iOS長按抖動動畫 */
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }
    .wiggle-mode {
      animation: wiggle 0.3s ease-in-out infinite;
    }
    .tag-wrapper .delete-badge { display: none; }
    .wiggle-mode .delete-badge { display: flex !important; }

  </style>
</head>

<body class="flex items-center justify-center min-h-screen sm:p-2 p-0">

  <div id="phoneFrame" class="relative w-full sm:max-w-[400px] h-[100dvh] sm:h-[880px] crochet-bg sm:rounded-[44px] sm:shadow-2xl flex flex-col sm:border border-morandi-200/90 overflow-hidden">
    
    <header class="px-5 pt-3.5 pb-2.5 flex items-center justify-between z-30 shrink-0 bg-oat-50/95 backdrop-blur-md border-b border-morandi-100/80 sticky top-0">
      <div class="flex items-center space-x-2">
        <button id="navBackBtn" onclick="app.goHome()" class="hidden mr-1 text-morandi-600 active:scale-90 transition p-1" title="返回首頁">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 id="pageTitle" class="text-base font-serifTitle tracking-widest font-semibold text-morandi-900 flex"></h1>
      </div>
      
      <div class="flex items-center space-x-2">
        <span id="brandTitle" class="text-[11px] font-serifBrand tracking-widest text-morandi-600 font-semibold uppercase flex"></span>
        <div class="w-1.5 h-1.5 rounded-full bg-morandi-400"></div>
      </div>
    </header>

    <main id="mainContainer" class="flex-1 relative overflow-hidden no-scrollbar">
      
      <!-- 1. 首頁 -->
      <section id="viewHome" class="view-section flex flex-col z-10 !p-0">
        <div class="w-full aspect-[4/3] shrink-0 relative overflow-hidden shadow-sm">
          <img class="home-slide opacity-100 absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out" src="https://lh3.googleusercontent.com/d/1u4LTKoTXwWbKNZTNnNzVJxCMKewV4HfD" alt="櫥窗1">
          <img class="home-slide opacity-0 absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out" src="https://lh3.googleusercontent.com/d/1TjKCMXaEbWDH6TdZa7kvXqjjYo69q9mw" alt="櫥窗2">
          <img class="home-slide opacity-0 absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out" src="https://lh3.googleusercontent.com/d/1rF4LYr5580X4PlbBljPSZKn0beKRH-LK" alt="櫥窗3">
          <div class="absolute bottom-3 left-4 bg-white/20 backdrop-blur-md px-3 py-1 rounded-xl shadow-sm border border-white/30 pointer-events-none z-10">
            <span class="text-xs text-white font-serifTitle tracking-widest font-semibold drop-shadow-md">Linda</span>
          </div>
        </div>

        <div class="w-full max-w-[260px] mx-auto mt-6 flex flex-col space-y-3.5 pb-8 flex-1 justify-center">
          <button onclick="app.navigate('yarns', 1)" class="glass-bead-card w-full h-[76px] px-5 flex items-center justify-between group">
            <div class="flex items-center space-x-4">
              <div class="w-11 h-11 p-2.5 rounded-[14px] bg-gradient-to-tr from-morandi-100 to-white flex items-center justify-center text-morandi-600 shadow-inner border border-white">
                <i class="ph ph-yarn text-2xl"></i>
              </div>
              <div class="text-left">
                <span class="text-[15px] font-serifTitle font-bold text-morandi-900 tracking-widest block">毛線櫃</span>
                <span class="text-[9px] font-serifBrand italic text-morandi-400 tracking-wider">Yarn Cabinet</span>
              </div>
            </div>
            <svg class="w-4 h-4 text-morandi-300 group-hover:text-morandi-600 transition group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </button>

          <button onclick="app.navigate('library', 1)" class="glass-bead-card w-full h-[76px] px-5 flex items-center justify-between group">
            <div class="flex items-center space-x-4">
              <div class="w-11 h-11 p-2.5 rounded-[14px] bg-gradient-to-tr from-morandi-100 to-white flex items-center justify-center text-morandi-600 shadow-inner border border-white">
                <i class="ph ph-book-bookmark text-2xl"></i>
              </div>
              <div class="text-left">
                <span class="text-[15px] font-serifTitle font-bold text-morandi-900 tracking-widest block">織典</span>
                <span class="text-[9px] font-serifBrand italic text-morandi-400 tracking-wider">Pattern Codex</span>
              </div>
            </div>
            <svg class="w-4 h-4 text-morandi-300 group-hover:text-morandi-600 transition group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </button>

          <button onclick="app.navigate('gallery', 1)" class="glass-bead-card w-full h-[76px] px-5 flex items-center justify-between group">
            <div class="flex items-center space-x-4">
              <div class="w-11 h-11 p-2.5 rounded-[14px] bg-gradient-to-tr from-morandi-100 to-white flex items-center justify-center text-morandi-600 shadow-inner border border-white">
                <i class="ph ph-palette text-2xl"></i>
              </div>
              <div class="text-left">
                <span class="text-[15px] font-serifTitle font-bold text-morandi-900 tracking-widest block">藝廊</span>
                <span class="text-[9px] font-serifBrand italic text-morandi-400 tracking-wider">Atelier Gallery</span>
              </div>
            </div>
            <svg class="w-4 h-4 text-morandi-300 group-hover:text-morandi-600 transition group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </button>

          <button onclick="app.navigate('chronometer', 1)" class="glass-bead-card w-full h-[76px] px-5 flex items-center justify-between group">
            <div class="flex items-center space-x-4">
              <div class="w-11 h-11 p-2.5 rounded-[14px] bg-gradient-to-tr from-morandi-100 to-white flex items-center justify-center text-morandi-600 shadow-inner border border-white">

          </button>
        </div>
      </section>

      <!-- 2. 毛線櫃 View -->

        <div class="flex items-center justify-end px-1 py-0.5 border-b border-morandi-100/80">

            </button>
            <button onclick="app.toggleYarnGridDensityMenu()" id="yarnLayoutBtn_grid" class="w-7 h-7 rounded-lg flex items-center justi
